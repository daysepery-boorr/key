<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Key Manager</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 820px; margin: 36px auto; padding: 0 16px; background: #10131b; color: #edf0f7; }
    .panel { background: #191f2b; border: 1px solid #30394b; border-radius: 14px; padding: 18px; margin: 16px 0; }
    input, button { font: inherit; border-radius: 8px; padding: 10px 12px; }
    input { background: #0e1118; color: inherit; border: 1px solid #46516a; width: min(100%, 440px); box-sizing: border-box; }
    button { border: 0; background: #9cc2ff; color: #111827; cursor: pointer; font-weight: 650; margin: 5px 4px 5px 0; }
    button.secondary { background: #30394b; color: #edf0f7; }
    .muted { color: #aab4c8; }
    .status-on { color: #75e0a0; } .status-off { color: #ff9999; }
    li { margin: 14px 0; overflow-wrap: anywhere; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Key Manager</h1>
  <p class="muted">For managing keys for your own application. The admin token is sent only to this server; do not share it.</p>

  <section class="panel">
    <label for="adminToken">Admin token</label><br>
    <input id="adminToken" type="password" autocomplete="off" placeholder="Paste ADMIN_TOKEN here">
    <p>
      <button id="createBtn">Generate key</button>
      <button id="refreshBtn" class="secondary">Refresh list</button>
    </p>
    <p id="message" role="status" class="muted"></p>
  </section>

  <section class="panel">
    <h2>Keys</h2>
    <ul id="keyList"></ul>
  </section>

<script>
const tokenInput = document.getElementById("adminToken");
const message = document.getElementById("message");
const keyList = document.getElementById("keyList");

async function api(url, method = "GET", body) {
  const headers = { "Authorization": "Bearer " + tokenInput.value };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const response = await fetch(url, {
    method, headers,
    ...(body !== undefined ? { body: JSON.stringify(body) } : {})
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

document.getElementById("createBtn").addEventListener("click", async () => {
  try {
    const item = await api("/api/keys", "POST", {});
    message.textContent = "Created: " + item.key;
    await refreshKeys();
  } catch (err) { message.textContent = err.message; }
});

document.getElementById("refreshBtn").addEventListener("click", refreshKeys);

async function refreshKeys() {
  try {
    const keys = await api("/api/keys");
    keyList.replaceChildren();
    for (const item of keys) {
      const li = document.createElement("li");
      const code = document.createElement("code");
      code.textContent = item.key + " — ";
      const status = document.createElement("span");
      status.className = item.enabled ? "status-on" : "status-off";
      status.textContent = item.enabled ? "Enabled" : "Disabled";
      const toggle = document.createElement("button");
      toggle.className = "secondary";
      toggle.textContent = item.enabled ? "Disable" : "Enable";
      toggle.addEventListener("click", async () => {
        try {
          await api("/api/keys/" + encodeURIComponent(item.key), "PATCH", { enabled: !item.enabled });
          await refreshKeys();
          message.textContent = "Updated key status.";
        } catch (err) { message.textContent = err.message; }
      });
      li.append(code, status, document.createTextNode(" "), toggle);
      keyList.appendChild(li);
    }
    message.textContent = `Loaded ${keys.length} key(s).`;
  } catch (err) { message.textContent = err.message; }
}
</script>
</body>
</html>
